[project]
name = "cc_distribution_parser"
version = "0.1.0"
description = "Extracts capital-call and distribution notices into validated structured fields with HITL review."
requires-python = ">=3.11,<3.13"   # Phoenix/LangGraph/Instructor wheel coverage on 3.13+ unverified
dependencies = [
    # Web + schema
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.9,<0.1",     # FastAPI file uploads
    "jinja2>=3.1,<4",                   # HITL UI templates

    # Snowflake (warehouse: extractions, corrections, exemplars w/ Cortex VECTOR, eval, drift, dlq, audit)
    "snowflake-connector-python>=3.10,<4",
    "snowflake-sqlalchemy>=1.6,<2",
    "sqlalchemy>=2.0,<3",

    # SQLite ops state (LangGraph checkpoints + HITL queue locks)
    "alembic>=1.13,<2",

    # AWS — Bedrock SDK; configure adaptive retry mode in app code (Sprint 2)
    "boto3>=1.34,<2",

    # Document parsing
    "docling~=2.0",
    "spacy>=3.7,<4",
    "spacy-layout~=0.0.12",

    # LLM stack — pinned tight per spec/critical-review.md W6 (R10)
    "instructor>=1.4,<2",
    "tenacity>=9.0,<10",

    # Orchestration — minor-compatible pins per .claude/rules/framework-swap.md
    # Sprint 0 note: langgraph 0.2.x was never published on PyPI; first public release was 1.x.
    # langgraph-checkpoint-sqlite 0.x similarly never published; first release was 1.x (now 3.x).
    # No LangGraph code existed when pins were updated, so migration cost = zero.
    "langgraph~=1.1",
    "langgraph-checkpoint-sqlite~=3.0",

    # Observability — Phoenix sidecar promoted to MVP Sprint 1 per v1.1 lock
    "structlog>=24.1,<25",
    "opentelemetry-api>=1.26,<2",
    "opentelemetry-sdk>=1.26,<2",
    "opentelemetry-exporter-otlp>=1.26,<2",
    "arize-phoenix>=15.0,<16",

    # Config + secrets
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=5,<6",
    "pyright>=1.1.380,<2",
    "pip-audit>=2.7,<3",
    "httpx>=0.27,<1",                   # FastAPI TestClient transport
    "moto[s3]>=5.0,<6",                 # local S3 emulation in unit tests
]
eval = [
    "deepeval>=3.0,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cc_distribution_parser"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "eval: golden-eval suite; CI-gated on PRs touching prompts/schemas/models",
    "integration: end-to-end with real Bedrock + Snowflake (skip in CI default)",
    "security: prompt-injection / red-team suite (eval-time)",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "build", "dist"]
# DocState is intentionally total=False — each pipeline stage sets only the
# keys it produces. KeyError at runtime is an expected failure mode (stage
# misordering), not a static-analyzable bug.
reportTypedDictNotRequiredAccess = false
