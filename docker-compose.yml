# Local dev stack for cc-distribution-parser.
#
# Snowflake = firm-managed cloud (no local container; configure conn via env).
# Phoenix sidecar = local OTel collector + UI (Sprint 1 deliverable per v1.1 lock).
# MinIO = local S3 emulator for blob storage in dev.

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ccdp-app
    ports:
      - "8000:8000"
    environment:
      # Snowflake — firm cloud; populate from .env (gitignored)
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-CCDP}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-PUBLIC}
      # AWS Bedrock — VPC-hosted in prod; local dev uses ambient creds
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # OTel → Phoenix sidecar
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:4317
      OTEL_SERVICE_NAME: cc-distribution-parser
      # Local S3 (MinIO). Use ${VAR:?msg} so compose fails loudly if a prod-shaped deploy
      # forgets to override these — prevents minioadmin/minioadmin from leaking past dev.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env (use minioadmin for local MinIO)}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env (use minioadmin for local MinIO)}
      S3_BUCKET: ${S3_BUCKET:-ccdp-blobs}
      # SQLite ops state
      SQLITE_OPS_PATH: /data/ops.db
      # Keep host src tree clean
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - app-data:/data
      # Editable source mount (NOT :ro — uvicorn --reload + Python writes __pycache__).
      # PYTHONDONTWRITEBYTECODE in env keeps the host tree clean.
      - ./src:/app/src
    depends_on:
      - phoenix
      - minio
    command: uvicorn cc_distribution_parser.main:app --host 0.0.0.0 --port 8000 --reload

  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: ccdp-phoenix
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC
    environment:
      PHOENIX_PORT: 6006
      PHOENIX_GRPC_PORT: 4317
    volumes:
      - phoenix-data:/mnt/data

  minio:
    image: minio/minio:latest
    container_name: ccdp-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  app-data:
  phoenix-data:
  minio-data:
